backend:
  name: github
  repo: Hoermaeuschen/website
  branch: main
  base_url: https://www.hoermaeuschen.ch
  auth_endpoint: /api/auth

locale: de

media_folder: assets
public_folder: assets

collections:
  - name: website
    label: Website-Inhalte
    files:

      - name: content
        label: Inhalte verwalten
        file: songs.json
        fields:

          - name: youtube_videos
            label: Hörproben (YouTube-Videos)
            label_singular: YouTube-Video
            widget: list
            required: false
            summary: "Video {{index}}"
            fields:
              - name: embed_code
                label: YouTube Einbettungs-Code (iframe)
                widget: text
                hint: "Auf YouTube: Teilen → Einbetten → Code kopieren. Den kompletten <iframe ...>...</iframe> Code hier einfügen."

          - name: artist_streaming
            label: Streaming-Profile (Künstler-Seiten)
            widget: object
            fields:
              - { name: spotify,      label: Spotify,       widget: string, required: false }
              - { name: youtube,      label: YouTube,       widget: string, required: false }
              - { name: apple,        label: Apple Music,   widget: string, required: false }
              - { name: amazon,       label: Amazon Music,  widget: string, required: false }
              - { name: youtubeMusic, label: YouTube Music, widget: string, required: false }

          - name: shop_products
            label: Shop-Produkte
            label_singular: Produkt
            widget: list
            required: false
            summary: "{{fields.title}}"
            fields:
              - { name: title,      label: Titel,       widget: string }
              - { name: type,       label: Typ,         widget: string, hint: "z. B. Kinderlied, Ausmalbilder, Geschichte" }
              - { name: cover,      label: Cover-Bild,  widget: image,  required: false }
              - { name: price,      label: Preis,       widget: string, hint: "z. B. CHF 1.50" }
              - { name: payhip_url, label: Payhip-Link, widget: string, hint: "https://payhip.com/b/..." }
              - { name: visible,    label: Sichtbar,    widget: boolean, default: true }
